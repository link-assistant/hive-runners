{{- $name := printf "%s-hive" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- with .Values.monitoring.serviceMonitor }}
{{- if .enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  {{- with .labels }}
  labels: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $name }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .interval | quote }}
      authorization:
        type: Bearer
        credentials:
          name: {{ required "monitoring.serviceMonitor.secretName is required" .secretName | quote }}
          key: {{ .secretKey | quote }}
---
{{- end }}
{{- end }}
{{- with .Values.monitoring.grafanaDashboard }}
{{- if .enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-dashboard
  labels: {{ toYaml .labels | nindent 4 }}
data:
  hive-runners.json: |-
    {{- $.Files.Get "dashboards/fleet.json" | nindent 4 }}
{{- end }}
{{- end }}
