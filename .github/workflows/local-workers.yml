name: Local worker containment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/local-workers.yml'
      - 'src/local/**'
      - 'src/process.js'
      - 'src/validation.js'
      - 'experiments/local-workers/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-workers.yml'
      - 'src/local/**'
      - 'src/process.js'
      - 'src/validation.js'
      - 'experiments/local-workers/**'

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  linux-docker:
    name: Linux Docker limits (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 6
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-linux-docker-${{ matrix.os }}-${{ (github.event_name == 'pull_request' && github.event.action == 'synchronize' && 'sync') || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Verify live Docker CPU, memory and filesystem limits
        shell: bash
        run: bash scripts/run-with-budget-warning.sh 150 "Bounded Linux Docker worker probes" node experiments/local-workers/linux-docker.mjs

  linux-orchestrators:
    name: Linux worker placement (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [swarm, kind]
    timeout-minutes: 8
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-linux-${{ matrix.backend }}-${{ (github.event_name == 'pull_request' && github.event.action == 'synchronize' && 'sync') || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Fetch the pinned kind binary
        if: matrix.backend == 'kind'
        shell: bash
        run: |
          binary_dir="$RUNNER_TEMP/hive-kind"
          mkdir -p "$binary_dir"
          bash scripts/run-with-budget-warning.sh 35 "Download pinned kind binary" curl --fail --silent --show-error --location https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64 --output "$binary_dir/kind"
          printf '%s  %s\n' eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa "$binary_dir/kind" | sha256sum --check --strict
          chmod 0755 "$binary_dir/kind"
          printf '%s\n' "$binary_dir" >> "$GITHUB_PATH"
      - name: Disable swap on the disposable runner
        shell: bash
        run: |
          sudo swapoff --all &
          wait "$!"
      - name: Verify worker placement and live limits
        shell: bash
        env:
          SMOKE_BACKEND: ${{ matrix.backend }}
        run: bash scripts/run-with-budget-warning.sh 210 "Bounded Linux orchestrator probes" node experiments/local-workers/linux-orchestrators.mjs "$SMOKE_BACKEND"
