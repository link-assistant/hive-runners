services:
  hive-runners:
    build: .
    ports:
      - '127.0.0.1:8080:8080'
    env_file:
      - .env
    volumes:
      - ./hive-runners.json:/etc/hive/config.json:ro
      - state:/var/lib/hive
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 2m
volumes:
  state:
