<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runner portal · Hive Runners</title>
    <link rel="stylesheet" href="hive.css" />
    <script type="module" src="portal.js"></script>
  </head>
  <body>
    <header class="shell top">
      <a class="brand" href="index.html"
        ><span aria-hidden="true">H</span> Hive Runners</a
      >
      <nav aria-label="Main"><a href="guide.html">Docs</a></nav>
    </header>
    <main class="shell interior">
      <h1>Runner portal</h1>
      <p class="lede">
        Use the account key from your fleet operator to check credit, add funds,
        and activate your runner pool.
      </p>
      <form id="login">
        <label
          >Runner account key
          <input
            id="key"
            type="password"
            required
            minlength="32"
            maxlength="512"
            autocomplete="off"
        /></label>
        <button class="button" type="submit">Open account</button>
      </form>
      <p id="status" role="status"></p>
      <section id="account" aria-labelledby="account-heading" hidden>
        <h2 id="account-heading">Your runner pool</h2>
        <p id="summary"></p>
        <p id="activation"></p>
        <pre id="example"></pre>
        <form id="activate">
          <label
            >Activation window (minutes)
            <input
              id="minutes"
              type="number"
              min="1"
              max="60"
              value="30"
              required /></label
          ><button class="button" type="submit">Activate runners</button>
        </form>
        <p>
          <button class="button outline" id="stop" type="button">
            End activation
          </button>
        </p>
        <h2>Add execution credit</h2>
        <form id="checkout">
          <label
            >Top-up (USD)
            <input
              id="amount"
              type="number"
              min="5"
              max="1000"
              step="0.01"
              value="10"
              required /></label
          ><button class="button outline" type="submit">
            Continue to checkout <span aria-hidden="true">↗</span>
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
